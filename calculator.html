<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body bgcolor="gray">
    <fieldset>
        <legend><h1>Calculator</h1></legend>
        <fieldset>
  <legend>  <h1><em>Addition</em></h1></legend>
<form action="hello" oninput="result.value=parseInt(num1.value)+parseInt(num2.value)">
<input type="number" id="num1"    placeholder="enter first number">  <br>
+<br>
<input type="number" id="num2" placeholder="enter second number."> <br>
 <h3>Total</h3><output name="result"  id="result" for=" num1 num2"></output>
</form>
        </fieldset>
        <fieldset>
<legend><h1><em>Substraction</em></h1></legend>
<form action="hello" oninput="result.value=parseInt(num1.value)-parseInt(num2.value)">
<input type="number" id="num1"    placeholder="enter first number">  <br>
- <br>
<input type="number" id="num2" placeholder="enter second number." > <br>
<h3>Total</h3><output name="result"  id="result" for=" num1 num2"></output>
</form>
        </fieldset>
        <fieldset>
<legend><h1><em>Multiplication</em></h1></legend>
<form action="hello" oninput="result.value=parseInt(num1.value)*parseInt(num2.value)">
<input type="number" id="num1"    placeholder="enter first number">  <br>
* <br>
<input type="number" id="num2" placeholder="enter second number." > <br>
<h3>Total</h3><output name="result"  id="result" for=" num1 num2"></output>
</form>
        </fieldset>
        <fieldset>
<legend><h1><em>Division</em></h1></legend>
<form action="hello" oninput="result.value=parseInt(num1.value)/parseInt(num2.value)">
<input type="number" id="num1"    placeholder="enter first number">  <br>
/ <br>
<input type="number" id="num2" placeholder="enter second number." > <br>
<h3>Total</h3><output name="result"  id="result" for=" num1 num2"></output>
</form>
</fieldset>
</Fieldset>
</body>
</html>
